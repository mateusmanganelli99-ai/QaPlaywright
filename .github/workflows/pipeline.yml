name: QA Enterprise Pipeline

run-name: "${{ github.workflow }} | ${{ github.ref_name }} | ${{ github.actor }}"

on:
  pull_request:
    branches: [ main ]

  push:
    branches: [ main ]

  workflow_dispatch:
    inputs:
      test_filter:
        description: "Filtro do dotnet test. Ex: Category=Smoke, Category=Regression ou vazio para todos."
        required: false
        default: ""
      workers:
        description: "Quantidade de workers paralelos do NUnit."
        required: false
        default: "4"

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: qa-enterprise-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 8.0.x
  TEST_RESULTS_DIR: TestResults
  REPORTS_DIR: reports
  TRX_FILE: e2e.trx
  NUNIT_WORKERS: ${{ github.event.inputs.workers || '4' }}
  TEST_FILTER: ${{ github.event.inputs.test_filter || '' }}

jobs:
  build:
    name: Build & Restore
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore

  e2e-tests:
    name: Parallel E2E Execution (${{ github.event.inputs.workers || '4' }} workers)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build test project
        run: dotnet build --no-restore

      - name: Install Playwright browsers
        run: pwsh bin/Debug/net8.0/playwright.ps1 install --with-deps

      - name: Publish execution configuration
        shell: pwsh
        run: |
          "## QA Execution Configuration" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "| Item | Value |" >> $env:GITHUB_STEP_SUMMARY
          "| --- | --- |" >> $env:GITHUB_STEP_SUMMARY
          "| Branch | $env:GITHUB_REF_NAME |" >> $env:GITHUB_STEP_SUMMARY
          "| Commit | $env:GITHUB_SHA |" >> $env:GITHUB_STEP_SUMMARY
          "| Trigger | $env:GITHUB_EVENT_NAME |" >> $env:GITHUB_STEP_SUMMARY
          "| .NET | $env:DOTNET_VERSION |" >> $env:GITHUB_STEP_SUMMARY
          "| Execution mode | Parallel |" >> $env:GITHUB_STEP_SUMMARY
          "| NUnit workers | $env:NUNIT_WORKERS |" >> $env:GITHUB_STEP_SUMMARY
          "| Test filter | $env:TEST_FILTER |" >> $env:GITHUB_STEP_SUMMARY

      - name: Run E2E tests in parallel
        shell: pwsh
        run: |
          $args = @(
            "test",
            "--settings", "nunit.runsettings",
            "--results-directory", $env:TEST_RESULTS_DIR,
            "--logger", "trx;LogFileName=$env:TRX_FILE"
          )

          if (![string]::IsNullOrWhiteSpace($env:TEST_FILTER)) {
            $args += @("--filter", $env:TEST_FILTER)
          }

          dotnet @args -- NUnit.NumberOfTestWorkers=$env:NUNIT_WORKERS

      - name: Upload TRX test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-trx
          path: ${{ env.TEST_RESULTS_DIR }}/${{ env.TRX_FILE }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos
          path: "**/videos/*.webm"
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: "**/screenshots/*.png"
          if-no-files-found: ignore
          retention-days: 7

  publish-report:
    name: Publish Test Report
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: always()
    timeout-minutes: 10

    steps:
      - name: Download TRX results
        uses: actions/download-artifact@v4
        with:
          name: test-results-trx
          path: downloaded-results

      - name: Generate enterprise Markdown report
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:REPORTS_DIR | Out-Null

          $reportPath = Join-Path $env:REPORTS_DIR "e2e-summary.md"
          $trxPath = Get-ChildItem -Path downloaded-results -Recurse -Filter $env:TRX_FILE | Select-Object -First 1

          if ($null -eq $trxPath) {
            "# E2E Test Report`n`nTRX file was not found in downloaded artifacts." | Set-Content $reportPath
            Get-Content $reportPath >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          [xml]$trx = Get-Content $trxPath.FullName
          $counters = $trx.SelectSingleNode("//*[local-name()='Counters']")
          $failedResults = $trx.SelectNodes("//*[local-name()='UnitTestResult' and @outcome!='Passed']")

          $lines = @(
            "# E2E Test Report",
            "",
            "## Execution",
            "",
            "| Item | Value |",
            "| --- | --- |",
            "| Mode | Parallel |",
            "| NUnit workers | $env:NUNIT_WORKERS |",
            "| Test filter | $env:TEST_FILTER |",
            "| Test job result | ${{ needs.e2e-tests.result }} |",
            "",
            "## Results",
            "",
            "| Total | Passed | Failed | Skipped |",
            "| ---: | ---: | ---: | ---: |",
            "| $($counters.total) | $($counters.passed) | $($counters.failed) | $($counters.notExecuted) |",
            ""
          )

          if ($failedResults.Count -gt 0) {
            $lines += "## Failed Tests"
            $lines += ""

            foreach ($result in $failedResults) {
              $lines += "- $($result.testName): $($result.outcome)"
            }
          }

          $lines | Set-Content $reportPath
          Get-Content $reportPath >> $env:GITHUB_STEP_SUMMARY

      - name: Upload Markdown report
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: ${{ env.REPORTS_DIR }}/
          if-no-files-found: error
          retention-days: 14

  publish-evidence:
    name: Publish Evidence
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: always()
    timeout-minutes: 5

    steps:
      - name: Evidence summary
        shell: pwsh
        run: |
          "## QA Evidence" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "- TRX artifact: test-results-trx" >> $env:GITHUB_STEP_SUMMARY
          "- Video artifact: playwright-videos" >> $env:GITHUB_STEP_SUMMARY
          "- Screenshot artifact: failure-screenshots" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "Evidence artifacts are attached to this workflow run when files are generated." >> $env:GITHUB_STEP_SUMMARY

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs:
      - e2e-tests
      - publish-report
      - publish-evidence
    if: always()
    timeout-minutes: 5

    steps:
      - name: Validate pipeline result
        shell: pwsh
        run: |
          "## Quality Gate" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "| Check | Result |" >> $env:GITHUB_STEP_SUMMARY
          "| --- | --- |" >> $env:GITHUB_STEP_SUMMARY
          "| E2E tests | ${{ needs.e2e-tests.result }} |" >> $env:GITHUB_STEP_SUMMARY
          "| Report publishing | ${{ needs.publish-report.result }} |" >> $env:GITHUB_STEP_SUMMARY
          "| Evidence publishing | ${{ needs.publish-evidence.result }} |" >> $env:GITHUB_STEP_SUMMARY

          if ("${{ needs.e2e-tests.result }}" -ne "success") {
            throw "Quality gate failed because E2E tests did not pass."
          }
