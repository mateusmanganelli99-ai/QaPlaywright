name: QA Enterprise Pipeline

on:
  pull_request:
    branches: [ main ]

  push:
    branches: [ main ]

jobs:

  # 🔹 1. BUILD
  build:
    name: Build & Setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Install Playwright
        run: |
          dotnet tool install --global Microsoft.Playwright.CLI
          playwright install --with-deps

  # 🔹 2. SMOKE TESTS
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: dotnet restore

      - name: Run Smoke Tests
        run: dotnet test --filter "Category=Smoke" --logger "trx;LogFileName=smoke.trx"

      - name: Upload Smoke Results
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: '**/smoke.trx'

  # 🔹 3. E2E TESTS (PARALELO)
  e2e-tests:
    name: E2E Tests Parallel
    runs-on: ubuntu-latest
    needs: smoke-tests

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]  # paralelismo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: dotnet restore

      - name: Run E2E Tests
        run: dotnet test --logger "trx;LogFileName=e2e-${{ matrix.shard }}.trx"

      - name: Upload Videos
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ matrix.shard }}
          path: videos/

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.shard }}
          path: screenshots/

  # 🔹 4. RELATÓRIO
  report:
    name: Generate Report
    runs-on: ubuntu-latest
    needs: e2e-tests

    steps:
      - uses: actions/checkout@v4

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: final-results
          path: '**/*.trx'