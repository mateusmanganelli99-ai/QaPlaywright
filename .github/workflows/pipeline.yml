name: QA Enterprise Pipeline

on:
  pull_request:
    branches: [ main ]

  push:
    branches: [ main ]

jobs:

  # 1. BUILD
  build:
    name: Build & Setup
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: dotnet restore
      - run: dotnet build --no-restore

  # 2. E2E TESTS
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: dotnet restore
      - run: dotnet build --no-restore

      - name: Install Playwright Browsers
        run: pwsh bin/Debug/net8.0/playwright.ps1 install --with-deps

      - name: Run E2E Tests
        run: dotnet test --logger "trx;LogFileName=e2e.trx"

      - name: Upload Videos
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: videos/

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

  # 3. REPORT
  report:
    name: Generate Report
    runs-on: ubuntu-latest
    needs: e2e-tests

    steps:
      - uses: actions/checkout@v4

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: final-results
          path: "**/*.trx"
